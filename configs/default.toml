[data]
name = "pglib_case14_test"
network_name = "case14"
n_cases = 200
seed = 123
max_attempts_multiplier = 5

[perturb]
load_scale_min = 0.95
load_scale_max = 1.05
local_load_noise_scale = 0.05
reactive_noise_scale = 0.02

[model]
hidden_channels = 64
dropout = 0.0
device_type_embedding_dim = 4
action_std_init = 0.02

[pretrain]
epochs = 40
batch_size = 16
learning_rate = 1e-3
weight_decay = 0.0

[ppo]
updates = 30
rollout_size = 32
learning_rate = 5e-5
clip_ratio = 0.1
value_loss_weight = 0.5
entropy_weight = 0.0
ppo_epochs = 4
max_grad_norm = 1.0
nonconvergence_penalty = 30.0
seed = 123

[search]
hidden_channels = [64, 128]
ppo_learning_rate = [5e-5, 1e-4]
ppo_entropy_weight = [0.0, 1e-4]
nonconvergence_penalty = [30]

[benchmark]
network_names = ["case14"]
n_cases = 500
seed = 123
include_flat = true
include_pf = true
create_plots = true