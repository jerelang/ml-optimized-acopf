name: CI
on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                    enable-cache: true
            - name: Sync dependencies
              run: uv sync --group dev
            - name: Ruff
              run: uv run ruff check .
            - name: Type check
              run: uv run basedpyright
            - name: Tests
              run: uv run pytest -q

    docker:
        runs-on: ubuntu-latest
        needs: test
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Buildx
              uses: docker/setup-buildx-action@v3
            - name: Log in to GHCR
              if: startsWith(github.ref, 'refs/tags/v')
              uses: docker/login-action@v3
              with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}
            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                    context: .
                    push: ${{ startsWith(github.ref, 'refs/tags/v') }}
                    tags: |
                        ghcr.io/jerelang/ml-optimized-acopf:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
                        ghcr.io/jerelang/ml-optimized-acopf:latest
                    cache-from: type=gha
                    cache-to: type=gha,mode=max