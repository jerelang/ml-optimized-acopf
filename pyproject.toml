[project]
name = "ml_acopf"
version = "0.1.0"
description = "Baseline data generation and benchmarking for PandaModels AC-OPF experiments."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "juliacall>=0.9.31",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandapower[pandamodels]>=3.4.0",
  "polars>=1.6",
  "pyarrow>=16.0.0",
  "pydantic>=2.12.0",
  "rich>=14.2.0",
  "seaborn>=0.13.2",
  "torch>=2.10.0",
  "torch-geometric>=2.7.0",
  "tqdm>=4.67.3",
  "typer>=0.20.0",
  "numba>=0.65.0",
]

[project.scripts]
ml_acopf = "ml_acopf.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_acopf"]
include = ["src/ml_acopf/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["README.md", "configs/default.toml", "src/ml_acopf/py.typed"]

[dependency-groups]
dev = [
  "basedpyright>=1.16",
  "ipykernel>=6.29",
  "pre-commit>=3.8",
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"
reportOptionalMemberAccess = "warning"
failOnWarnings = false
exclude = [
  "**/.venv",
  "**/.uv",
  "**/__pycache__",
  ".pytest_cache",
  ".ruff_cache",
  "build",
  "dist",
  "data",
  "outputs",
]

[tool.pytest.ini_options]
addopts = "-q -ra"
testpaths = ["tests"]
filterwarnings = [
  "ignore:tap_dependency_table is missing in net.*:DeprecationWarning",
]
