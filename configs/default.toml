[data]
name = "case14_test"
network_name = "case14"
n_cases = 2
seed = 123
max_attempts_multiplier = 2

[perturb]
load_scale_min = 0.90
load_scale_max = 1.10

[solver]
pm_solver = "ipopt"
pm_tol = 1e-8
pm_log_level = 0
delta = 1e-8
calculate_voltage_angles = true
check_connectivity = true
correct_pm_network_data = true
silence = true
delete_buffer_file = true
opf_flow_lim = "S"

[model]
hidden_channels = 64
dropout = 0.0
device_type_embedding_dim = 4
action_std_init = 0.05

[pretrain]
epochs = 5
batch_size = 8
learning_rate = 1e-3
weight_decay = 0.0

[ppo]
updates = 5
rollout_size = 32
learning_rate = 3e-4
clip_ratio = 0.2
value_loss_weight = 0.5
entropy_weight = 0.01
ppo_epochs = 4
max_grad_norm = 1.0
nonconvergence_penalty = 10.0
seed = 123

[search]
hidden_channels = [64, 128, 256, 512]
ppo_learning_rate = [5e-4, 3e-4, 1e-4]
ppo_entropy_weight = [1e-2, 1e-3]
nonconvergence_penalty= [10, 12, 15]