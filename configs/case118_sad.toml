[data]
name = "pglib_case118_sad"
network_name = "case118_sad"
n_cases = 500
seed = 123
max_attempts_multiplier = 20

[perturb]
load_scale_min = 0.99
load_scale_max = 1.01
local_load_noise_scale = 0.01
reactive_noise_scale = 0.005

[model]
hidden_channels = 256
dropout = 0.0
device_type_embedding_dim = 4
action_std_init = 0.005

[pretrain]
epochs = 75
batch_size = 16
learning_rate = 1e-3
weight_decay = 0.0

[ppo]
updates = 300
rollout_size = 32
learning_rate = 1e-5
clip_ratio = 0.1
value_loss_weight = 0.5
entropy_weight = 0.0
ppo_epochs = 4
max_grad_norm = 1.0
nonconvergence_penalty = 50.0
seed = 123

[search]
hidden_channels = [128, 256]
ppo_learning_rate = [3e-5, 5e-5]
ppo_entropy_weight = [0.0]
nonconvergence_penalty = [50]

[benchmark]
network_names = ["case118_sad"]
n_cases = 500
seed = 123
include_flat = true
include_pf = true
create_plots = true