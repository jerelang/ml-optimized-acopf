name: CI
on:
    push:
        branches: [main]
    pull_request:
permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v6
            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                    enable-cache: true
            - name: Sync dependencies
              run: uv sync --group dev
            - name: Ruff
              run: uv run ruff check .
            - name: Type check
              run: uv run basedpyright
            - name: Tests
              run: uv run pytest -q --ignore=tests/test_data_pipeline.py
